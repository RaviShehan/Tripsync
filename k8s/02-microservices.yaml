# ============================================================================
# TripSync - Kubernetes manifests (demonstrative, single-node friendly)
# Apply in order:
#   kubectl apply -f k8s/
# ============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: tripsync
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: tripsync/api-gateway:latest
          ports:
            - containerPort: 4000
          envFrom:
            - configMapRef:
                name: tripsync-config
            - secretRef:
                name: tripsync-secrets
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: tripsync-secrets
                  key: JWT_SECRET
          readinessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: tripsync
spec:
  selector:
    app: api-gateway
  ports:
    - port: 4000
      targetPort: 4000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tour-service
  namespace: tripsync
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tour-service
  template:
    metadata:
      labels:
        app: tour-service
    spec:
      containers:
        - name: tour-service
          image: tripsync/tour-service:latest
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: tripsync-secrets
                  key: DATABASE_URL_TOUR
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapRef:
                  name: tripsync-config
                  key: KAFKA_BOOTSTRAP_SERVERS
---
apiVersion: v1
kind: Service
metadata:
  name: tour-service
  namespace: tripsync
spec:
  selector:
    app: tour-service
  ports:
    - port: 3000
      targetPort: 3000
---
