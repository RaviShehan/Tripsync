apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: tripsync
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: tripsync/frontend:latest
          ports:
            - containerPort: 3001
          env:
            - name: NEXT_PUBLIC_API_GATEWAY_URL
              value: "http://api-gateway:4000"
            - name: PORT
              value: "3001"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: tripsync
spec:
  selector:
    app: frontend
  ports:
    - port: 3001
      targetPort: 3001
  type: LoadBalancer
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tripsync-ingress
  namespace: tripsync
spec:
  rules:
    - host: tripsync.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3001
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 4000
